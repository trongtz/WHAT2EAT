services:
  postgres:
    image: postgres:15-alpine
    container_name: what2eat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: what2eat
      POSTGRES_PASSWORD: what2eat_dev
      POSTGRES_DB: what2eat_db
    ports:
      - "5434:5432"
    volumes:
      - what2eat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U what2eat -d what2eat_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  what2eat_postgres_data:
